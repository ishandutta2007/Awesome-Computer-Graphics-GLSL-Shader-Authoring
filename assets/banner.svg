<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080914" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glassmorphic Card Fill -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(99, 102, 241, 0.25)" />
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.75; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.45; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes shimmer {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 80px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 280px;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
    .pill-4 { animation: floatPill 6.5s ease-in-out infinite 1.5s; }
    .animated-wire {
      stroke-dasharray: 8 6;
      animation: waveFlow 4s linear infinite;
    }
    .sparkle { animation: shimmer 3s ease-in-out infinite; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background (behind text) -->
  <circle class="orb-1" cx="220" cy="90" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.4" />
  <circle class="orb-2" cx="980" cy="240" r="160" fill="#ec4899" filter="url(#glow)" opacity="0.35" />
  <circle cx="600" cy="340" r="120" fill="#06b6d4" filter="url(#glow)" opacity="0.25" />

  <!-- Animated Background Flow Lines (Strictly behind text & foreground cards) -->
  <path class="animated-wire" d="M -50 120 Q 300 40 600 130 T 1250 80" fill="none" stroke="rgba(99, 102, 241, 0.35)" stroke-width="2" />
  <path class="animated-wire" d="M -50 250 Q 350 330 650 220 T 1250 270" fill="none" stroke="rgba(236, 72, 153, 0.3)" stroke-width="2" />

  <!-- Decorative Subtle UI Primitives & Pill Badges (Positioned cleanly at edges) -->
  <!-- Left Side Badges -->
  <g class="pill-1" transform="translate(60, 48)">
    <rect width="145" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#10b981" />
    <text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Tailwind CSS</text>
  </g>

  <g class="pill-2" transform="translate(45, 275)">
    <rect width="145" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#6366f1" />
    <text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🧩 Radix Primitives</text>
  </g>

  <!-- Right Side Badges -->
  <g class="pill-3" transform="translate(980, 52)">
    <rect width="155" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#06b6d4" />
    <text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎨 Modern UI Design</text>
  </g>

  <g class="pill-4" transform="translate(995, 275)">
    <rect width="145" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#ec4899" />
    <text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✨ Copy-Paste Kits</text>
  </g>

  <!-- FOREGROUND: High Contrast, Crystal Clear Title and Subtitle -->
  <!-- Category Overline / Tag -->
  <g transform="translate(600, 105)">
    <rect x="-140" y="-18" width="280" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.2" />
    <text x="0" y="4" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Top Component Libraries &amp; Modern UI
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Copy-Paste Primitives • Accessible Design Systems • Tailwind CSS • Headless UI
  </text>

  <!-- Bottom Interactive Technology Badges Row (Centered Foreground) -->
  <g transform="translate(365, 245)">
    <rect x="0" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="42" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">React</text>

    <rect x="95" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="137" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Next.js</text>

    <rect x="190" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="232" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Vue &amp; Svelte</text>

    <rect x="285" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="327" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Tailwind CSS</text>

    <rect x="380" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="422" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">TypeScript</text>
  </g>
</svg>
