<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080914"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#05070f"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="0" r="1.5" fill="rgba(99, 102, 241, 0.25)"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="30"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.45}50%{transform:scale(1.15) translate(25px,-15px);opacity:.75}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes waveFlow{0%{stroke-dashoffset:0}}@keyframes shimmer{0%{opacity:.3}50%{opacity:.8}}.orb-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 80px}.orb-2{animation:pulseOrb 10s ease-in-out infinite alternate-reverse;transform-origin:1000px 280px}.pill-1{animation: